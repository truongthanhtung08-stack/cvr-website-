<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mất kết nối — COASTAL LAND</title>
<style>
  :root { --ink: #1d1d1f; --muted: #6e6e73; --line: #e5e5e7; --blue: #0071e3; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left));
    background: #fff; color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .box { width: 100%; max-width: 380px; text-align: center; }
  .mark { height: 40px; width: auto; margin-bottom: 28px; opacity: .9; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
  p { margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
  button {
    margin-top: 28px; width: 100%; height: 48px; border: 0; border-radius: 999px;
    background: var(--blue); color: #fff; font-size: 15px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: transform .2s cubic-bezier(.16,1,.3,1), opacity .2s;
  }
  button:active { transform: scale(.98); }
  .hint { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; }
</style>
</head>
<body>
  <div class="box">
    <img class="mark" src="/logo/symbol-dark.svg" alt="COASTAL LAND" onerror="this.style.display='none'" />
    <h1>Chưa có kết nối mạng</h1>
    <p>Vui lòng kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại. Những trang bạn đã xem vẫn mở được khi không có mạng.</p>
    <button type="button" onclick="location.reload()">Thử lại</button>
    <p class="hint">COASTAL LAND — Bất động sản Duyên hải Miền Trung</p>
  </div>
</body>
</html>
