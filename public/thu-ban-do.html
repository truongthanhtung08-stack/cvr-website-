<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thử bản đồ Google — Coastal Land</title>
<style>
  body{font:15px/1.5 system-ui,sans-serif;margin:0;padding:16px;background:#fff;color:#1d1d1f}
  #bando{width:100%;height:60vh;min-height:320px;border:1px solid #d2d2d7;border-radius:12px;background:#f5f5f7}
  #ketqua{margin-top:12px;padding:12px;border-radius:10px;background:#f5f5f7;white-space:pre-wrap;font-size:13px}
</style>
</head>
<body>
<h2>Thử bản đồ Google</h2>
<div id="bando"></div>
<div id="ketqua">Đang nạp…</div>
<script>
  var K = "AIzaSyDHVZN3N4HDJmyBUBvop_kmUw9jnZBKb-I";
  var log = function (t) { document.getElementById("ketqua").textContent = t; };
  window.gm_authFailure = function () { log("GOOGLE TỪ CHỐI KHOÁ (gm_authFailure) — lỗi tài khoản/khoá, không phải code."); };
  window.batDau = function () {
    try {
      new google.maps.Map(document.getElementById("bando"), {
        center: { lat: 16.0544, lng: 108.2022 }, zoom: 15, gestureHandling: "greedy",
      });
      setTimeout(function () {
        var n = document.querySelectorAll("#bando .gm-style").length;
        log(n > 0 ? "✅ BẢN ĐỒ VẼ ĐƯỢC — Google chạy bình thường." : "❌ Thư viện nạp xong nhưng không vẽ (.gm-style = 0).");
      }, 6000);
    } catch (e) { log("Lỗi khi tạo bản đồ: " + e); }
  };
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDHVZN3N4HDJmyBUBvop_kmUw9jnZBKb-I&language=vi&region=VN&callback=batDau"></script>
</body>
</html>
